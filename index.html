function mods(g){const n=g.nft;MD=MODELS.includes(n.m)?MODELS:PEP;return `<h4>Модели · ${MD.length}</h4><div class="ms">${MD.map((m,i)=>`<div class="mc${m==n.m?' on':''}" onclick="pvm(${i},this)"><div class="em2" style="filter:hue-rotate(${i*23}deg)">${g.e}</div><div class="sm">${m}</div><span class="rp">${(.5+i*37%120/10).toFixed(1)}%</span></div>`).join('')}</div><h4>Фоны · ${BACKS.length}</h4><div class="ms">${BACKS.map((b,i)=>`<div class="mc${b[0]==n.b[0]?' on':''}" onclick="pvb(${i},this)"><div class="dot" style="background:radial-gradient(circle at 50% 35%,${b[1]},${b[2]})"></div><div class="sm">${b[0]}</div></div>`).join('')}</div><h4>Узоры · ${SYMS.length}</h4><div class="ms">${SYMS.map((y,i)=>`<div class="mc${y==n.s?' on':''}" onclick="pvs(${i},this)"><div class="em2">${y}</div><div class="sm">${SYMN[i]}</div></div>`).join('')}</div>`}
const SYMN=['Звезда','Снежинка','Клевер','Корона','Луна','Сердце','Солнце','Молния','Цветок','Нота'],rp=v=>`<span class="rp">${v}%</span>`;
function pat(s,big){let h='';[[8,28,30,big?26:18],[12,44,42,big?20:14]].forEach((r,k)=>{for(let i=0;i<r[0];i++){const a=(i/r[0]+k*.5/r[0])*6.2832;h+=`<span style="left:${50+r[1]*Math.cos(a)}%;top:${40+r[2]*Math.sin(a)}%;font-size:${r[3]}px">${s}</span>`}});return h}
function nftc(g,click){const n=g.nft,b=n.b,t=`color:color-mix(in srgb,${b[1]} 35%,#fff)`;return `<div class="nft ${click?'gc':'hb'}" style="background:radial-gradient(circle at 50% 35%,${b[1]},${b[2]})" ${click?`onclick="dt(${g.id})"`:''}><div class="pat">${pat(n.s,!click)}</div>${click?'':`<button class="xb" onclick="cs()">✕</button><button class="xb r" onclick="toast('Скоро')">⋯</button>`}<div class="em" style="filter:hue-rotate(${hu(g)}deg) drop-shadow(0 6px 10px #0004)">${g.e}</div><div class="tt">${g.n}<small>#${n.num}</small></div><div class="ts" style="${t}">${n.m}</div></div>`}
const sq=(g,fn,pr)=>{const n=g.nft,b=n.b;return `<div class="nft sq" style="background:radial-gradient(circle at 50% 35%,${b[1]},${b[2]})" onclick="${fn||'dt'}(${g.id})"><div class="pat">${pat(n.s,0)}</div><span class="nn">#${n.num}</span><div class="em" style="filter:hue-rotate(${hu(g)}deg) drop-shadow(0 6px 10px #0004)">${g.e}</div><div class="tt">${g.n}</div>${pr?`<div class="ts">${pr}</div>`:''}</div>`};
function gc(g,o,c){if(g.nft)return nftc(g,1);return `<div class="gc"><div class="ge">${g.e}</div><b>${o?(c.s?'Подарок себе':'Вы отправили подарок'):'Подарок от '+c.n}</b><div>${g.n} · ⭐ ${g.p}</div>${g.nu?'':`<button class="bt" onclick="up(${g.id})">Улучшить до NFT · ⭐ ${UPS}</button>`}</div>`}
function rh(){const c=C(S.cur);$('#head').innerHTML=`<button class="ib" id="back" onclick="cl()">←</button><div style="display:flex;gap:10px;align-items:center;flex:1;cursor:pointer" onclick="cprof()">${av(c)}<div><b>${nm(c)}</b><div class="sm" style="${c.ty?'color:var(--pri)':''}">${c.ty?'печатает…':c.k=='g'?'участников: '+(c.mem.length+1):c.k=='c'?'канал · подписчиков: 1':c.on?'в сети':'был(а) недавно'}</div>${c.v?ofl():''}</div></div><button class="ib" onclick="call()">📞</button>`}
function rm(){const c=C(S.cur),e=$('#msgs');e.innerHTML=c.m.map(m=>m.g?gc(m.g,m.o,c):m.j?`<div class="gc"><div class="ge">💎</div><b>${m.o?'Вы отправили':'Вам отправили'}</b><div>${m.j} JUM</div></div>`:`<div class="m ${m.o?'out':'in'}">${esc(m.t)}<span class="tm">${m.h}${m.o?(m.nd?' ✓':' ✓✓'):''}</span></div>`).join('');e.scrollTop=e.scrollHeight}
function rall(){sv();rl();if(S.cur){rh();rm()}}
